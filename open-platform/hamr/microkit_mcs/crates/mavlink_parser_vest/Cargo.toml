[package]
name = "mavlink_parser_vest"
version = "0.1.0"
edition = "2024"

[dependencies]
vstd = { version = "=0.0.0-2026-09-06-0133", default-features=false }
verus_builtin = { version = "=0.0.0-2026-09-06-0133" }
verus_builtin_macros = { version = "=0.0.0-2026-09-06-0133" }
vest_lib = { version = "=0.2.1", default-features = false, features = ["alloc"] }

[package.metadata.verus]
verify = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)"] }
